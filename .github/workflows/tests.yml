name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: ruff check src/api.py src/weather.py src/weather_features.py run.py tests
      - run: node --check web/app.js
      - run: bandit -q -r src run.py -ll
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: pytest -q
        env:
          PYTHONPATH: .
